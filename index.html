<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Books">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<title>My Books</title><link rel="stylesheet" href="style.css"></head><body>
<main>
<section id="home"><p class="sub" id="yr"></p><h1>My Books</h1>
<div class="summary"><div><b id="tY">0</b><span>read this year</span></div><div><b id="tA">0</b><span>all time</span></div></div>
<div class="hrow"><h2>Library</h2><button class="lnk" id="editBtn">Edit</button></div>
<div id="lib"></div>
<button class="big" id="manBtn">＋ Add a book by hand</button></section>
<section id="search" hidden><h1>Search</h1>
<form id="sf"><input id="q" type="search" placeholder="Books, authors, series" autocomplete="off"></form>
<div id="sres"></div></section>
</main>
<nav><button data-t="home" class="on"><span>📚</span>Library</button><button data-t="search"><span>🔍</span>Search</button></nav>
<dialog id="dlg"><div id="dc"></div></dialog>
<div id="toast"></div>
<script src="app.js"></script></body></html>
